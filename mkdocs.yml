site_name: Vigil Insurance - Proactive Safety Agent
theme:
  name: material
  palette:
    scheme: slate
    primary: sky blue
    accent: amber
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Setup: setup.md
  - Architecture: architecture.md
  - Agents & Tools: agents.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
