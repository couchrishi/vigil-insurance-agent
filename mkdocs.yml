site_name: Vigil Insurance - Proactive Safety Agent
site_url: https://couchrishi.github.io/vigil-insurance-agent/
theme:
  name: material
  palette:
    scheme: slate
    primary: sky blue
    accent: amber
  features:
    - navigation.sections
    - content.code.copy

# This tells the browser how to actually DRAW the diagram
extra_javascript:
  - https://unpkg.com/mermaid@10.3.0/dist/mermaid.min.js
  - javascripts/mermaid-init.js

nav:
  - Home: index.md
  - Setup: setup.md
  - Architecture: architecture.md
  - Agents & Tools: agents.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
